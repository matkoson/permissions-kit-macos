name: qa

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  code-quality: write

jobs:
  qa:
    name: QA
    runs-on: [self-hosted, macOS, ARM64, matkoson-qa, fleet, m4-fleet]
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Run deterministic repository QA
        run: ./local/qa
      - name: Upload coverage report
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-code-coverage@1c15be36fc3733ba839b1dd643bd9556e4426dc1 # v1
        with:
          file: .build/coverage/cobertura.xml
          language: Swift
          label: code-coverage/swift
          fail-on-error: false
